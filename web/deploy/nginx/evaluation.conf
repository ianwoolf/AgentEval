server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index evaluation.html;
    server_tokens off;
    client_max_body_size 8m;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/v1/evaluations/ {
        proxy_pass http://evaluation-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location /api/ { default_type application/json; return 404 '{"detail":"Not found"}'; }
    location /internal/ { return 404; }
    location = /evaluation-config.json { add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /evaluation.html; add_header Cache-Control "no-cache"; }
}
