# Standalone evaluation SPA. No Control API, PostgreSQL or browser authentication.
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-ui-runtime
  namespace: evaluation
data:
  evaluation-config.json: '{"projectId":"individual","apiBase":"/api/v1/evaluations"}'
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index evaluation.html;
      server_tokens off;
      client_max_body_size 8m;
      location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
      location /api/v1/evaluations/ {
        proxy_pass http://evaluation-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
      }
      location /api/ { default_type application/json; return 404 '{"detail":"Not found"}'; }
      location /internal/ { return 404; }
      location = /evaluation-config.json { add_header Cache-Control "no-store"; }
      location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
      location / { try_files $uri $uri/ /evaluation.html; add_header Cache-Control "no-cache"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-ui
  namespace: evaluation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-ui
  template:
    metadata:
      labels:
        app: evaluation-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: evaluation-ui:compact-report-20261030
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: runtime
              mountPath: /usr/share/nginx/html/evaluation-config.json
              subPath: evaluation-config.json
              readOnly: true
            - name: runtime
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: runtime
          configMap:
            name: evaluation-ui-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-ui
  namespace: evaluation
spec:
  selector:
    app: evaluation-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
